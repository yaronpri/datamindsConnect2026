# Release pipeline: deploys the items committed in the sales-analytics folder with fabric-cicd.
#
# Trigger : pushing a tag (for example v1.0.0) that points to a commit on main.
# Stages  : Validate (tag is on main) -> Test (test-sales-analytics) -> Prod (prod-sales-analytics).
#           Test and Prod are deployment jobs that target the Azure DevOps environments
#           test-sales-analytics and prod-sales-analytics, so each environment shows its deployment history.
#           Add an Approvals check on the prod-sales-analytics environment to gate Prod.
# Publish : fabric-cicd bulk publish (experimental) with dynamic replacement variables (release/parameter.yml).
#
# Pipeline variables (set on the pipeline definition):
#   - TENANT_ID, CLIENT_ID : service principal tenant and client id
#   - CLIENT_SECRET        : service principal secret (secret variable)

name: release-$(Build.SourceBranchName)-$(Rev:r)

trigger:
  branches:
    include:
      - refs/tags/*

pr: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Validate
    jobs:
      - job: VerifyTag
        displayName: Verify tag is on main
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - script: |
              set -e
              if [[ "$(Build.SourceBranch)" != refs/tags/* ]]; then
                echo "##vso[task.logissue type=error]This pipeline deploys tags only (got $(Build.SourceBranch))."
                exit 1
              fi
              git fetch --quiet origin main
              if ! git merge-base --is-ancestor HEAD origin/main; then
                echo "##vso[task.logissue type=error]Tag $(Build.SourceBranchName) does not point to a commit on main."
                exit 1
              fi
              echo "Tag $(Build.SourceBranchName) ($(git rev-parse --short HEAD)) is on main."
            displayName: Verify tag is on main

  - stage: Test
    displayName: Test (test-sales-analytics)
    dependsOn: Validate
    jobs:
      - deployment: Deploy
        displayName: Deploy to test-sales-analytics
        environment: test-sales-analytics
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy-steps.yml
                  parameters:
                    targetWorkspace: test-sales-analytics
                    environment: TEST

  - stage: Prod
    displayName: Prod (prod-sales-analytics)
    dependsOn: Test
    jobs:
      - deployment: Deploy
        displayName: Deploy to prod-sales-analytics
        environment: prod-sales-analytics
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy-steps.yml
                  parameters:
                    targetWorkspace: prod-sales-analytics
                    environment: PROD
