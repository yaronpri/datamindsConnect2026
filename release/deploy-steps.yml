# Steps shared by every release stage: deploy the tagged commit to one workspace with fabric-cicd.

parameters:
  - name: targetWorkspace
    type: string
  - name: environment
    type: string

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: "3.12"

  - script: pip install --quiet fabric-cicd==1.4.0 azure-identity
    displayName: Install fabric-cicd

  - script: python release/deploy.py
    displayName: Deploy to ${{ parameters.targetWorkspace }}
    env:
      TENANT_ID: $(TENANT_ID)
      CLIENT_ID: $(CLIENT_ID)
      CLIENT_SECRET: $(CLIENT_SECRET)
      TARGET_WORKSPACE: ${{ parameters.targetWorkspace }}
      ENVIRONMENT: ${{ parameters.environment }}
